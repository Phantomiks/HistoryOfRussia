<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <h1>История Бот</h1>
      <p class="subtitle">Личный кабинет</p>
    </div>
  </div>

  <!-- Profile -->
  <div class="card profile-card">
    <img id="avatar" src="https://via.placeholder.com/80" class="avatar" alt="Avatar">
    <h2 id="username">Гость</h2>
    <p id="userId">ID: -</p>
    <div class="streak">
      🔥 Дни подряд: <span id="streakCount">0</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="card stats-card">
    <div class="stats">
      <div>
        <h3 id="level">1</h3>
        <p>Ранг</p>
      </div>
      <div>
        <h3 id="points">0</h3>
        <p>Баллы</p>
      </div>
      <div>
        <h3 id="tasksDone">0</h3>
        <p>Задания</p>
      </div>
    </div>
    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="levelProgress"></div>
      </div>
      <p>Опыт до следующего уровня</p>
    </div>
  </div>

  <!-- Achievements -->
  <div class="card achievements-card">
    <h3>Ачивки</h3>
    <div class="achievements-grid" id="achievementsGrid">
      <!-- Медальки -->
    </div>
  </div>

  <!-- История действий -->
  <div class="card history-card">
    <h3>История действий</h3>
    <ul id="historyList"></ul>
  </div>

  <!-- Referral -->
  <div class="card referral-card">
    <h3>Реферальная программа</h3>
    <p>Приглашайте друзей и получайте бонусы!</p>
    <button id="copyLink" class="btn btn-primary">Скопировать ссылку</button>
  </div>

</div>

<!-- Modal для ачивок -->
<div class="modal hidden" id="modal">
  <div class="modal-content">
    <span class="close" id="modalClose">&times;</span>
    <h3 id="modalTitle">Ачивка</h3>
    <p id="modalDesc">Описание</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
