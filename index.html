<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Борьба умов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" class="app">
  <!-- Главный экран -->
  <div id="screen-start" class="screen hero">
    <h2>Борьба умов</h2>
    <div class="btn-row">
      <button id="soloBtn" class="btn btn-primary">Соло</button>
      <button id="duelBtn" class="btn btn-secondary">Дуэль</button>
      <button id="cabinetBtn" class="btn btn-ghost">Личный кабинет</button>
    </div>
  </div>

  <!-- Викторина -->
  <div id="screen-quiz" class="screen hidden">
    <div class="panel">
      <div class="meta">
        <span id="qIndex">Вопрос 1/10</span>
        <span class="timer" id="timer">15</span>
      </div>
      <div class="question-card">
        <h3 id="questionText">Вопрос</h3>
        <div class="answers">
          <div class="answer" id="ans0"><span class="ans-label">A</span> <span class="ans-text"></span></div>
          <div class="answer" id="ans1"><span class="ans-label">B</span> <span class="ans-text"></span></div>
          <div class="answer" id="ans2"><span class="ans-label">C</span> <span class="ans-text"></span></div>
          <div class="answer" id="ans3"><span class="ans-label">D</span> <span class="ans-text"></span></div>
        </div>
      </div>
      <div class="progress">
        <div class="progress__bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <!-- Личный кабинет -->
  <div id="screen-cabinet" class="screen hidden">
    <div class="card endcard">
      <h3>Личный кабинет</h3>
      <p>Очки: <span id="userPoints">0</span></p>
      <p>Ачивки:</p>
      <ul id="achievements">
        <li>Новичок: завершил первую игру</li>
        <li>Победитель: выиграл рейтинг</li>
      </ul>
      <button id="backBtn" class="btn btn-secondary">Назад</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
