<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Историческая лента</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="root">

  <!-- Карточка истории -->
  <div class="story-card" id="storyCard">
    <div class="story-content">
      <h2 class="story-date" id="storyDate">26 ноября 2025</h2>
      <p class="story-desc" id="storyDesc">
        Подписание важного исторического документа, которое изменило ход истории.
      </p>
    </div>
    <div class="story-actions">
      <button class="btn btn-ghost" id="likeBtn">
        ❤️ <span id="likeCount">0</span>
      </button>
      <button class="btn btn-ghost" id="bookmarkBtn">🔖</button>
    </div>
  </div>

  <!-- Навигация -->
  <div class="story-nav">
    <button class="btn btn-secondary" id="prevBtn">⬆️</button>
    <button class="btn btn-secondary" id="nextBtn">⬇️</button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
