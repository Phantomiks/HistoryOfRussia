<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Борьба умов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Главный экран -->
  <div id="screen-start" class="screen hero">
    <h2>Борьба умов</h2>
    <div class="btn-row">
      <button class="btn btn-primary" id="rateBtn">Играть на рейтинг</button>
      <button class="btn btn-secondary" id="casualBtn">Просто играть</button>
      <button class="btn btn-ghost" id="inviteBtn">Пригласить друга</button>
    </div>
  </div>

  <!-- Экран викторины -->
  <div id="screen-quiz" class="screen hidden">
    <div class="question-card">
      <div class="meta">
        <span id="qIndex">Вопрос 1/10</span>
        <div class="timer"><span id="timerNum">15</span> сек</div>
      </div>
      <h3 id="questionText">Вопрос...</h3>
      <div class="answers">
        <div class="answer" id="ans0"><div class="ans-label">A</div><div class="ans-text"></div></div>
        <div class="answer" id="ans1"><div class="ans-label">B</div><div class="ans-text"></div></div>
        <div class="answer" id="ans2"><div class="ans-label">C</div><div class="ans-text"></div></div>
        <div class="answer" id="ans3"><div class="ans-label">D</div><div class="ans-text"></div></div>
      </div>
      <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
    </div>
  </div>

  <!-- Экран конца игры -->
  <div id="screen-end" class="screen endcard hidden">
    <h2 id="endTitle">Победа!</h2>
    <p id="endScore">0 / 0</p>
    <p id="modeLabel">Рейтинг</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="playAgainBtn">Сыграть снова</button>
    </div>
    <p class="note">Результат сохраняется автоматически</p>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
