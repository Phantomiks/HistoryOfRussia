<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Борьба умов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- ======== Главный экран ======== -->
  <div id="screen-start" class="screen">
    <h1 class="title">Борьба умов</h1>
    <div class="buttons">
      <button id="inviteBtn" class="button">Пригласить друга</button>
      <button id="rateBtn" class="button">Играть на рейтинг</button>
      <button id="casualBtn" class="button">Просто играть</button>
    </div>
  </div>

  <!-- ======== Экран ожидания противника ======== -->
  <div id="screen-waiting" class="screen hidden">
    <h2>Ожидание противника...</h2>
    <p>Как только друг подключится, игра начнется!</p>
    <div class="loader"></div>
  </div>

  <!-- ======== Экран викторины ======== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <h2 id="qIndex">Вопрос 1/5</h2>
      <div class="timer-container">
        <div id="timer" class="timer">15</div>
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
    <div id="questionText" class="question-text">Вопрос...</div>
    <div id="answers" class="answers">
      <button class="ans-btn" id="ans0"><span class="ans-text"></span></button>
      <button class="ans-btn" id="ans1"><span class="ans-text"></span></button>
      <button class="ans-btn" id="ans2"><span class="ans-text"></span></button>
      <button class="ans-btn" id="ans3"><span class="ans-text"></span></button>
    </div>
  </div>

  <!-- ======== Экран конца игры ======== -->
  <div id="screen-end" class="screen hidden">
    <h2 id="endTitle">Победа!</h2>
    <p id="endScore">5/5</p>
    <p id="modeLabel">Рейтинг</p>
    <button id="playAgainBtn" class="button">Играть снова</button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
